[package]
name = "zcode-proxy"
version = "0.1.0"
edition = "2021"
description = "Rust data-plane surface for the zcode-proxy port: axum handlers over zcode-core"

[[bin]]
name = "zcode-proxy-rs"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
axum = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bcrypt = "0.15"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tower = { version = "0.5", features = ["util"] }
zcode-core = { path = "../zcode-core" }
zeroize = "1"

[dev-dependencies]
bcrypt = "0.15"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tower = { version = "0.5", features = ["util"] }
